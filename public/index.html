<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector OBJ Painting Editor</title>
    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter font for consistent typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Custom styles for specific elements -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="flex flex-col h-screen bg-gray-200">

    <!-- Top navigation bar for file operations -->
    <div class="bg-gray-700 text-white shadow-md py-2 px-4 flex items-center space-x-4 rounded-b-lg">
        <!-- Load OBJ Button -->
        <button id="load-obj-button"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
            </svg>
            <span data-lang-key="loadObj">Load OBJ</span>
        </button>
        <!-- Hidden input for file selection -->
        <input id="load-obj-input" type="file" accept=".obj" class="hidden">

        <!-- Open Project Button -->
        <button id="open-project-button"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z">
                </path>
            </svg>
            <span data-lang-key="openProject">Open Project</span>
        </button>
        <!-- Hidden input for project file selection -->
        <input id="open-project-input" type="file" accept=".kufi" class="hidden">

        <!-- Save Project Button -->
        <button id="save-project-btn"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4">
                </path>
            </svg>
            <span data-lang-key="saveProject">Save Project</span>
        </button>

        <!-- Save Project As Button -->
        <button id="save-project-as-btn"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
            </svg>
            <span data-lang-key="saveProjectAs">Save Project As</span>
        </button>

        <!-- Export SVG Button -->
        <button id="export-svg-btn"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                </path>
            </svg>
            <span data-lang-key="exportSvg">Export SVG</span>
        </button>

        <!-- Export PNG Button -->
        <button id="export-png-btn"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                </path>
            </svg>
            <span data-lang-key="exportPng">Export PNG</span>
        </button>

        <!-- Clear Canvas Button -->
        <button id="clear-canvas-btn"
            class="flex items-center px-3 py-2 rounded-md hover:bg-gray-600 transition duration-200">
            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                </path>
            </svg>
            <span data-lang-key="clear">Clear</span>
        </button>
    </div>

    <!-- Main content area: Sidebar and Canvas -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar for tools and colors -->
        <div class="w-48 bg-gray-800 text-white shadow-lg p-4 flex flex-col space-y-4 rounded-r-lg">
            <!-- Tool selection buttons -->
            <div class="flex flex-col space-y-2">
                <button id="tool-paint"
                    class="flex flex-col items-center justify-center p-2 rounded-md transition duration-200 bg-blue-600 border-2 border-yellow-400">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2V5a2 2 0 00-2-2h-2.586a1 1 0 01-.707-.293l-5.414-5.414a1 1 0 00-.707-.293H7a2 2 0 00-2 2v12a4 4 0 014 4z">
                        </path>
                    </svg>
                    <span data-lang-key="paintTool">Paint</span>
                </button>
                <button id="tool-erase"
                    class="flex flex-col items-center justify-center p-2 rounded-md transition duration-200 bg-gray-700 hover:bg-gray-600">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                        </path>
                    </svg>
                    <span data-lang-key="eraseTool">Erase</span>
                </button>
                <button id="tool-move"
                    class="flex flex-col items-center justify-center p-2 rounded-md transition duration-200 bg-gray-700 hover:bg-gray-600">
                    <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 9l3 3m0 0l3-3m-3 3v4m0 1.5a.5.5 0 01-.5.5h-3a.5.5 0 01-.5-.5v-3a.5.5 0 01.5-.5h3a.5.5 0 01.5.5v3zM12 12a9 9 0 100 18 9 9 0 000-18z">
                        </path>
                    </svg>
                    <span data-lang-key="moveTool">Move</span>
                </button>
            </div>

            <div class="h-px bg-gray-600 my-4"></div>
            <h3 class="text-sm font-bold text-gray-400 mb-2" data-lang-key="colorsTitle">Colors:</h3>
            <!-- Color palette will be populated by JavaScript -->
            <div class="grid grid-cols-2 gap-2" id="color-palette">
            </div>

            <div class="flex-grow"></div>
            <!-- Undo Button -->
            <button id="undo-btn"
                class="flex flex-col items-center justify-center p-2 rounded-md bg-gray-700 hover:bg-gray-600 transition duration-200">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 14l-4-4m0 0l4-4m-4 4h11a2 2 0 012 2v8a2 2 0 01-2 2H7a2 2 0 01-2-2V7a2 2 0 012-2h1">
                    </path>
                </svg>
                <span data-lang-key="undo">Undo</span>
            </button>
            <!-- Redo Button -->
            <button id="redo-btn"
                class="flex flex-col items-center justify-center p-2 rounded-md bg-gray-700 hover:bg-gray-600 transition duration-200">
                <svg class="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 10l4 4m0 0l-4 4m4-4H3a2 2 0 01-2-2V7a2 2 0 012-2h11a2 2 0 012 2v8a2 2 0 01-2 2H12z">
                    </path>
                </svg>
                <span data-lang-key="redo">Redo</span>
            </button>
        </div>

        <!-- Main canvas area -->
        <div class="flex-1 p-4 flex items-center justify-center overflow-hidden">
            <canvas id="objCanvas" class="bg-white rounded-lg shadow-inner w-full h-full"></canvas>
        </div>
    </div>

    <!-- Status bar at the bottom -->
    <div id="status-bar" class="bg-gray-700 text-white text-sm py-2 px-4 shadow-inner rounded-t-lg">
        <span data-lang-key="readyStatus">Ready</span>
    </div>

    <!-- Language selection flags -->
    <div class="absolute bottom-4 right-4 flex space-x-2 z-50">
        <!-- English Flag -->
        <div id="flag-en" class="flag-icon" data-lang="en" title="English">
            <svg viewBox="0 0 60 30" width="100%" height="100%">
                <clipPath id="a">
                    <path d="M0 0v30h60V0z" />
                </clipPath>
                <clipPath id="b">
                    <path d="M30 15h30v15H30zM0 15h30v15H0zM30 0h30v15H30zM0 0h30v15H0z" />
                </clipPath>
                <g clip-path="url(#a)">
                    <path d="M0 0v30h60V0z" fill="#012169" />
                    <path d="M0 0L60 30M60 0L0 30" stroke="#fff" stroke-width="6" />
                    <path d="M0 0L60 30M60 0L0 30" stroke="#C8102E" stroke-width="4" clip-path="url(#b)" />
                    <path d="M30 0v30M0 15h60" stroke="#fff" stroke-width="10" />
                    <path d="M30 0v30M0 15h60" stroke="#C8102E" stroke-width="6" />
                </g>
            </svg>
        </div>
        <!-- Turkish Flag -->
        <div id="flag-tr" class="flag-icon" data-lang="tr" title="Türkçe">
            <svg viewBox="0 0 60 30" width="100%" height="100%">
                <rect width="60" height="30" fill="#E30A17" />
                <circle cx="22.5" cy="15" r="7.5" fill="#fff" />
                <circle cx="24" cy="15" r="6" fill="#E30A17" />
                <path d="M33 15l7.5-2.5-4.5 7.5 4.5 7.5-7.5-2.5-7.5 2.5 4.5-7.5-4.5-7.5z" fill="#fff" />
            </svg>
        </div>
        <!-- Arabic Flag -->
        <div id="flag-ar" class="flag-icon" data-lang="ar" title="العربية">
            <svg viewBox="0 0 60 30" width="100%" height="100%">
                <rect width="60" height="30" fill="#007A3D" />
                <rect width="60" height="20" fill="#fff" />
                <rect width="60" height="10" fill="#000" />
                <path d="M0 0v30l15-15z" fill="#C8102E" />
            </svg>
        </div>
    </div>

    <!-- Custom Modal Container (hidden by default) -->
    <div id="modal-container"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div id="modal-content" class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <h2 id="modal-title" class="text-xl font-semibold mb-4 text-gray-800"></h2>
            <div id="modal-body" class="mb-6"></div>
            <div class="flex justify-end space-x-3">
                <button id="modal-cancel-btn"
                    class="px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition duration-200">
                    <span data-lang-key="cancelButton">Cancel</span>
                </button>
                <button id="modal-ok-btn"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200">
                    <span data-lang-key="okButton">OK</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Message Box Container (hidden by default) -->
    <div id="message-box-container"
        class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center z-50">
        <div id="message-box-content" class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4">
            <div class="flex items-center mb-4">
                <div id="message-box-icon"></div>
                <h2 id="message-box-title" class="text-xl font-semibold ml-3 text-gray-800"></h2>
            </div>
            <p id="message-box-message" class="text-gray-700 mb-6 whitespace-pre-wrap"></p>
            <div id="message-box-checkbox-container" class="mb-4 hidden">
                <label class="flex items-center text-gray-700">
                    <input id="message-box-checkbox" type="checkbox"
                        class="form-checkbox h-5 w-5 text-blue-600 rounded">
                    <span id="message-box-checkbox-label" class="ml-2"></span>
                </label>
            </div>
            <div class="flex justify-end">
                <button id="message-box-ok-btn"
                    class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition duration-200">
                    <span data-lang-key="okButton">OK</span>
                </button>
                <button id="message-box-cancel-btn"
                    class="ml-3 px-4 py-2 bg-gray-200 text-gray-700 rounded-md hover:bg-gray-300 transition duration-200 hidden">
                    <span data-lang-key="cancelButton">Cancel</span>
                </button>
            </div>
        </div>
    </div>

    <!-- External JavaScript file -->
    <script src="script.js"></script>
</body>

</html>
